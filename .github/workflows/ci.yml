# Runs tests/e2e.sh against the latest ranma release on every push to main and
# every pull request: a private, headless ranma in a tmux server of its own,
# cloning plugins from local git repositories.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq tmux
      - name: The latest ranma release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R masshirodev/ranma -p 'ranma-*-x86_64-unknown-linux-gnu.tar.gz' -D "$RUNNER_TEMP"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP"/ranma-*.tar.gz
          echo "$(dirname "$(find "$RUNNER_TEMP" -name ranma -type f)")" >> "$GITHUB_PATH"
      - run: ranma --version
      - run: tests/e2e.sh
